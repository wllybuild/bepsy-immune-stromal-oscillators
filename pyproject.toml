[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bepsy"
version = "1.0.0"
description = "Coupled immune-stromal oscillator world model"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "pyyaml>=6.0", "scipy>=1.12", "scikit-learn>=1.4"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
bepsy-train = "bepsy.commands.train:main"
bepsy-evaluate = "bepsy.commands.evaluate:main"
bepsy-prepare = "bepsy.commands.prepare:main"

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

