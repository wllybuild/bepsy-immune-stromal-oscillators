[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bepsy"
version = "1.0.0"
description = "Coupled immune-stromal oscillator world model"
requires-python = ">=3.10"
dependencies = ["torch==2.2.2", "numpy==1.26.4", "pyyaml==6.0.1", "scipy==1.12.0", "scikit-learn==1.4.2"]

[project.scripts]
bepsy-train = "bepsy.commands.train:main"
bepsy-evaluate = "bepsy.commands.evaluate:main"
bepsy-prepare = "bepsy.commands.prepare:main"

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100
target-version = "py310"
